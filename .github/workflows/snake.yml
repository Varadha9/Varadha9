name: Generate Graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Varadha9
          outputs: |
            dist/snake-contribution-graph.svg?palette=github
            dist/snake-contribution-graph-dark.svg?palette=github-dark&animate=true
            dist/pacman-contribution-graph.svg?palette=github&type=pacman
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&type=pacman&animate=true

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Varadha9
          template: classic
          base: activity, community, repositories
          plugin_isometric: yes
          plugin_isometric_frames: 6
          filename: metrics.isometric.svg
          committer_branch: output
          committer_message: "update metrics"
          output_action: gist
          output_condition: always

  activity-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Add activity graph to README
        uses: ashutosh00710/github-readme-activity-graph@v1.1.0
        with:
          username: Varadha9
          theme: tokyo-night
          hide_border: true
